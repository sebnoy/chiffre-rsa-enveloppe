[package]
name = "chiffre-rsa-enveloppe"
version = "2.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Orchestration multi-destinataires : produit/lit un .enc complet via chiffre-aes-core + chiffre-rsa-core"
repository = "https://github.com/sebnoy/chiffre-rsa-enveloppe"
readme = "README.md"

[dependencies]
chiffre_aes_core = { git = "https://github.com/sebnoy/chiffre-aes-core", tag = "v3.0.0" }
chiffre-rsa-core = { git = "https://github.com/sebnoy/chiffre-rsa-core", tag = "v2.0.0" }
thiserror = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3.20"
