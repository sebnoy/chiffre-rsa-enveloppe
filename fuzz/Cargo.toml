[package]
name = "chiffre-rsa-enveloppe-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"

[dependencies.chiffre-rsa-enveloppe]
path = ".."

# Même source que la bibliothèque (tag), sinon deux versions de
# `RsaKeyPair` coexistent et les cibles ne compilent pas.
[dependencies.chiffre-rsa-core]
git = "https://github.com/sebnoy/chiffre-rsa-core"
tag = "v2.0.0"

[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

[[bin]]
name = "decrypt_file_with_key"
path = "fuzz_targets/decrypt_file_with_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encrypt_decrypt_roundtrip"
path = "fuzz_targets/encrypt_decrypt_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decrypt_paths_with_key"
path = "fuzz_targets/decrypt_paths_with_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encrypt_decrypt_paths_roundtrip"
path = "fuzz_targets/encrypt_decrypt_paths_roundtrip.rs"
test = false
doc = false
bench = false
